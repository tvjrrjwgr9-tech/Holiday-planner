<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FBF5F4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Planner">
<title>Planner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
/* Planner: top tabs (Timetable | Checklists); timetable card with side column; checklists with subject tabs, exam lists and spec pages; timer bubble bottom-right on every page. Single light look. */
:root{
  --bg:#FBF5F4; --card:#FFFFFF; --border:#F0E0E0; --btnB:#E3CFD1; --row:#F3E6E6; --rowHalf:#F8EFEF;
  --mute:#85707A; --text2:#65505A; --text:#33252A; --tint:#F6E6E9; --dash:#DCC0C6;
  --inBg:#FDF9F9; --done:#B09EA2; --ink:#4A3345; --onInk:#FFFFFF; --red:#B3261E; --warn:#8A4B08; --warnBg:#FBEEDD;
  --now:#C2185B; --scrim:rgba(51,37,42,.3);
  --bio:#DAEDE6; --bioFg:#265244; --chem:#F7DDE8; --chemFg:#6E2C4A; --maths:#EADDF5; --mathsFg:#5B2D7F;
  --font:"DM Sans","Helvetica Neue",Helvetica,system-ui,sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
input[type=checkbox]{width:22px;height:22px;margin:0;accent-color:var(--ink);flex-shrink:0;cursor:pointer}
.app{max-width:1400px;margin:0 auto;padding-block:20px 120px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:27px;font-weight:600;letter-spacing:-.01em}
h2{margin:0;font-size:18px;font-weight:600}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px}
.pillBtn{min-height:42px;padding:0 16px;border-radius:21px;border:1px solid var(--btnB);background:var(--card);font-size:14px;font-weight:500;color:var(--ink)}
.pillBtn.sm{min-height:36px;padding:0 13px;border-radius:18px;font-size:12.5px}
.pillBtn.warnOn{border-color:var(--red);color:var(--red)}
.round{width:40px;height:40px;border-radius:20px;border:1px solid var(--btnB);background:var(--card);font-size:20px;line-height:1;color:var(--ink);flex-shrink:0}
.round.ink{background:var(--ink);border-color:var(--ink);color:var(--onInk)}
.round:disabled{opacity:.4}
.mainTabs{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:14px 14px 0 0;border:1px solid var(--border);border-bottom-width:2px}
.mainTabs button{border:0;background:transparent;min-height:54px;padding:0 12px;font-size:16.5px;font-weight:600;color:var(--mute);border-bottom:3px solid transparent;margin-bottom:-2px;text-align:center}
.mainTabs button+button{border-left:1px solid var(--border)}
.mainTabs button.on{color:var(--ink);border-bottom-color:var(--ink);background:var(--tint)}
.mainTabs button:first-child{border-top-left-radius:13px}.mainTabs button:last-child{border-top-right-radius:13px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sync{font-size:12px;color:var(--mute)}
.lnk{border:0;background:transparent;color:var(--ink);font-size:13px;font-weight:600;text-decoration:underline;padding:4px}
.note{font-size:12.5px;color:var(--mute);line-height:1.45}
.empty{font-size:14px;color:var(--mute);padding:8px 0 10px;line-height:1.5}
.in{width:100%;min-height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--btnB);background:var(--inBg);font-size:16px;color:var(--text)}
select.in{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.primary{min-height:46px;padding:0 20px;border-radius:12px;border:0;background:var(--ink);color:var(--onInk);font-size:14.5px;font-weight:600;flex-grow:1}
.primary:disabled{opacity:.45}
.secondary{min-height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--btnB);background:var(--card);color:var(--ink);font-size:14.5px;font-weight:500}
.danger{min-height:46px;padding:0 14px;border-radius:12px;border:0;background:transparent;color:var(--red);font-size:14.5px;font-weight:500}

/* ---------- timetable ---------- */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.tt{padding:14px 16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ttHead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ttRight{display:flex;align-items:center;gap:8px}
.weekNav{display:flex;align-items:center;gap:6px}
.weekNav .lbl{font-size:15px;font-weight:600;min-width:120px;text-align:center;font-variant-numeric:tabular-nums}
.navBtn{width:40px;height:40px;border-radius:20px;border:1px solid var(--btnB);background:var(--card);color:var(--ink);font-size:18px;line-height:1}
.seg{display:flex;border:1px solid var(--btnB);border-radius:20px;padding:3px;gap:2px}
.seg button{min-height:34px;padding:0 14px;border-radius:17px;border:0;background:transparent;font-size:13px;font-weight:600;color:var(--text2)}
.seg button.on{background:var(--ink);color:var(--onInk)}
.chips{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dchip{min-height:52px;border-radius:14px;border:1px solid var(--btnB);background:var(--card);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;position:relative}
.dchip small{font-size:11px;font-weight:500;color:var(--mute)}
.dchip b{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.dchip.on{background:var(--ink);border-color:var(--ink);color:var(--onInk)}
.dchip.on small{color:var(--onInk);opacity:.8}
.dchip.today:not(.on){box-shadow:inset 0 0 0 2px var(--ink)}
.dchip .dot{position:absolute;bottom:5px;width:5px;height:5px;border-radius:3px;background:var(--dash)}
.dchip.on .dot{background:var(--onInk);opacity:.7}
.dayBar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.dayBar .sub{font-size:13px;color:var(--mute);font-weight:500;margin-top:2px}
.dayBar .acts{display:flex;gap:6px;flex-wrap:wrap}
.hint{font-size:14px;color:var(--text2);background:var(--tint);border-radius:12px;padding:12px 14px;line-height:1.5;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tl{display:grid;grid-template-columns:64px minmax(0,1fr);position:relative}
.hours{position:relative}
.hours div{position:absolute;right:10px;transform:translateY(-50%);font-size:12px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.hours div:first-child{transform:none}
.lane{position:relative}
.slot{position:absolute;left:0;right:0;border:0;border-top:1px solid var(--row);background:transparent;padding:0 10px;text-align:left;font-size:12px;color:transparent;display:flex;align-items:center}
.slot.half{border-top:1px dashed var(--rowHalf)}
.slot:hover,.slot:focus-visible{background:var(--tint);color:var(--ink)}
.blk{position:absolute;border:0;border-radius:10px;padding:5px 9px;text-align:left;display:flex;flex-direction:column;gap:1px;overflow:hidden;z-index:2;box-shadow:0 0 0 2px var(--card)}
.blk b{font-size:13.5px;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.blk span{font-size:12px;line-height:1.25;opacity:.85;font-variant-numeric:tabular-nums}
.blk i{font-style:normal;font-size:12px;opacity:.8;overflow-wrap:anywhere}
.blk.tight{flex-direction:row;align-items:center;gap:6px;padding:0 9px;white-space:nowrap}
.blk.tight b{overflow:hidden;text-overflow:ellipsis;flex-shrink:1;min-width:0}
.blk.tight span{flex-shrink:0}
.blk.done b{text-decoration:line-through}
.blk.done{opacity:.6}
.nowLine{position:absolute;left:-6px;right:0;height:2px;background:var(--now);z-index:3;pointer-events:none}
.nowLine::before{content:"";position:absolute;left:0;top:-4px;width:10px;height:10px;border-radius:5px;background:var(--now)}
.wkWrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
.wk{min-width:760px}
.wkHead,.wkBody{display:grid;grid-template-columns:56px repeat(7,minmax(0,1fr));gap:0 6px}
.wkHead{margin-bottom:8px}
.wkDay{min-height:46px;border:0;border-radius:12px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text2)}
.wkDay small{font-size:11px;font-weight:500;color:var(--mute)}
.wkDay b{font-size:14px;font-weight:600}
.wkDay:hover{background:var(--tint)}
.wkDay.today{background:var(--ink);color:var(--onInk)}
.wkDay.today small{color:var(--onInk);opacity:.8}
.wk .blk{padding:3px 6px;border-radius:7px}
.wk .blk b{font-size:11.5px}
.wk .blk span{font-size:10.5px}
.wk .blk.tight{padding:0 6px}
.wk .hours div{right:8px;font-size:11px}
.side{display:flex;flex-direction:column;gap:20px;min-width:0}
.list{padding:14px 16px 12px;display:flex;flex-direction:column;gap:6px}
.listHead{display:flex;align-items:center;gap:8px;min-height:40px}
.listHead h2{flex-grow:1}
.tot{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:6px 0;border-top:1px solid var(--row)}
.tot .nm{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;min-width:0}
.tot .sw{width:12px;height:12px;border-radius:4px;flex-shrink:0}
.tot .v{font-size:13px;font-weight:600;color:var(--text2);font-variant-numeric:tabular-nums}
.tot .bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--row);overflow:hidden}
.tot .bar div{height:100%;border-radius:3px}
.totSum{font-size:13px;color:var(--mute);font-weight:500}
.todo{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--row)}
.todo span{flex-grow:1;font-size:14.5px;overflow-wrap:anywhere;min-width:0}
.todo.done span{text-decoration:line-through;color:var(--done)}
.x{width:36px;height:36px;border:0;background:transparent;color:var(--done);font-size:17px;flex-shrink:0}
.addRow{display:flex;gap:8px;margin-top:4px}.addRow .in{flex-grow:1;width:auto}

/* ---------- side panel (timetable editor) ---------- */
.overlay{position:fixed;inset:0;z-index:20;display:flex;background:var(--scrim)}
.scrim{flex-grow:1;border:0;background:transparent}
.panel{width:min(480px,100%);height:100%;background:var(--card);border-left:1px solid var(--border);display:flex;flex-direction:column;gap:16px;padding:calc(24px + env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) 22px;overflow:hidden;animation:slideIn .22s ease-out}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.pHead{display:flex;align-items:flex-start;gap:12px}
.pHead>div{flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.pKind{align-self:flex-start;font-size:12px;font-weight:600;padding:3px 10px;border-radius:10px;background:var(--tint);color:var(--ink)}
.pHead h2{font-size:21px;overflow-wrap:anywhere}
.pSub{font-size:13.5px;font-weight:500;color:var(--mute)}
.pBody{flex-grow:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:18px;padding-bottom:4px}
.pFoot{display:flex;gap:8px;flex-wrap:wrap}
.sec{display:flex;flex-direction:column;gap:8px}
.sec>label,.secLbl{font-size:13px;font-weight:600;color:var(--text2)}
.actGrid{display:flex;flex-wrap:wrap;gap:6px}
.aChip{min-height:38px;padding:0 13px;border-radius:19px;border:1.5px solid transparent;font-size:13.5px;font-weight:600}
.aChip.on{border-color:currentColor}
.lenRow{display:flex;flex-wrap:wrap;gap:6px}
.lChip{min-height:36px;min-width:52px;padding:0 10px;border-radius:18px;border:1px solid var(--btnB);background:var(--card);font-size:13px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.lChip.on{background:var(--ink);border-color:var(--ink);color:var(--onInk)}
.stepper{display:flex;align-items:center;gap:10px;margin-top:4px;flex-wrap:wrap}
.stepper .val{min-width:96px;text-align:center;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.ends{font-size:13.5px;color:var(--mute);font-weight:500}
.dayPick{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dayPick .dchip{min-height:46px}
.dayPick .dchip:disabled{opacity:.35}
.clash{font-size:13px;color:var(--warn);background:var(--warnBg);border-radius:10px;padding:9px 12px;line-height:1.45}
.step{font-size:14px;line-height:1.5;color:var(--text2);margin:0}

/* ---------- checklists ---------- */
.subTabs{display:flex;gap:6px;flex-wrap:wrap}
.subTabs button{min-height:44px;padding:0 20px;border-radius:12px;border:1.5px solid transparent;font-size:15px;font-weight:600}
.subTabs button.on{border-color:currentColor}
.subTabs button:not(.on){opacity:.75}
.secTabs{display:inline-flex;border:1px solid var(--btnB);border-radius:22px;padding:3px;gap:2px;align-self:flex-start;background:var(--card)}
.secTabs button{min-height:36px;padding:0 16px;border-radius:18px;border:0;background:transparent;font-size:13.5px;font-weight:600;color:var(--text2)}
.secTabs button.on{background:var(--ink);color:var(--onInk)}
.ck{padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.lists{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.lists .lbl{font-size:13px;font-weight:600;color:var(--text2);margin-right:4px}
.lchip{min-height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--btnB);background:var(--card);font-size:13px;font-weight:600;color:var(--ink)}
.lchip.on{background:var(--ink);color:var(--onInk);border-color:var(--ink)}
.lchip.add{border-style:dashed;color:var(--mute)}
.nameRow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.nameRow .in{flex:1;min-width:0;width:auto}
.ckHead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--text2);font-variant-numeric:tabular-nums}
.prog .bar{width:140px;height:8px;border-radius:4px;background:var(--row);overflow:hidden}
.prog .bar div{height:100%;border-radius:4px;transition:width .35s cubic-bezier(.3,1.2,.5,1)}
.tblWrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:420px}
th{font-size:12.5px;font-weight:600;color:var(--text2);text-align:center;padding:10px 6px;border-bottom:2px solid var(--border);white-space:nowrap}
th:first-child{text-align:left;padding-left:4px}
td{border-bottom:1px solid var(--row);padding:10px 6px;text-align:center}
td:first-child{text-align:left;font-size:15px;font-weight:500;padding-left:4px}
td.x{width:44px}
.xBtn{min-width:34px;height:34px;border:0;background:transparent;color:var(--done);font-size:15px;border-radius:8px}
.xBtn.arm{color:var(--red);font-size:12px;font-weight:600;background:#FBE9E7;padding:0 8px}
.topic{background:linear-gradient(currentColor,currentColor) no-repeat 0 58%/0% 2px;transition:background-size .35s ease,color .35s ease}
tr.all .topic{background-size:100% 2px;color:var(--done)}
tr.flash td{animation:rowGlow .9s ease}
@keyframes rowGlow{0%{background:transparent}25%{background:var(--subBg)}100%{background:transparent}}
.tick{appearance:none;-webkit-appearance:none;width:30px;height:30px;margin:0;border-radius:9px;border:2px solid var(--btnB);background:var(--card);display:inline-grid;place-content:center;vertical-align:middle;cursor:pointer;transition:background .15s ease,border-color .15s ease;flex-shrink:0}
.tick::after{content:"";width:11px;height:6px;margin-top:-3px;border-left:3px solid #fff;border-bottom:3px solid #fff;transform:rotate(-45deg) scale(0);transition:transform .18s cubic-bezier(.3,1.7,.6,1)}
.tick:checked{background:var(--sub);border-color:var(--sub)}
.tick:checked::after{transform:rotate(-45deg) scale(1)}
.tick:hover{border-color:var(--sub)}
.tick.pop{animation:pop .22s ease}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.22)}100%{transform:scale(1)}}
.nudge{display:inline-block;animation:nudge .25s ease}
@keyframes nudge{50%{transform:translateY(-2px) scale(1.08)}}
.confetti{position:fixed;width:7px;height:7px;border-radius:2px;pointer-events:none;z-index:40}
.uRow td{padding:0;background:var(--card)}
.uBtn{width:100%;display:flex;align-items:center;gap:10px;min-height:54px;padding:6px 6px;border:0;background:transparent;text-align:left}
.uBtn:hover{background:var(--tint)}
.chev{width:18px;flex-shrink:0;font-size:22px;line-height:1;color:var(--sub);text-align:center;transition:transform .2s ease}
.uRow.open .chev{transform:rotate(90deg)}
.uNum{min-width:28px;padding:0 6px;height:28px;border-radius:8px;background:var(--subBg);color:var(--sub);display:grid;place-items:center;font-size:13.5px;font-weight:700;flex-shrink:0;font-variant-numeric:tabular-nums}
.uName{flex:1;min-width:0;font-size:15px;font-weight:600;color:var(--text);line-height:1.3}
.uCount{font-size:12.5px;color:var(--mute);font-weight:500;white-space:nowrap}
.gRow td{background:var(--subBg);color:var(--sub);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:9px 8px;text-align:left;border-bottom:0}
tr.inU td:first-child{padding-left:62px}
tr.addR td{padding:8px 6px 14px 62px!important;text-align:left}
.fCell{display:flex;align-items:center;gap:10px;min-width:0}
.fCell .topic{line-height:1.35}
.uAdd{display:flex;gap:8px}
.uAdd .in{flex:1;width:auto;min-width:0}
.nameBox{display:flex;flex-direction:column;gap:10px;border:1px solid var(--border);border-radius:14px;padding:14px;background:var(--bg)}
.pickHead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px}
.pickCount{font-weight:500;color:var(--mute);margin-left:4px}
.uPick{display:flex;flex-wrap:wrap;gap:6px;max-height:340px;overflow:auto;padding:2px}
.pickG{flex-basis:100%;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);margin-top:6px}
.uChip{display:flex;align-items:center;gap:8px;min-height:40px;padding:4px 12px 4px 6px;border-radius:12px;border:1.5px solid var(--btnB);background:var(--card);font-size:13.5px;font-weight:500;color:var(--text);text-align:left;max-width:100%}
.uChip .uNum{min-width:26px;height:26px;font-size:12.5px}
.uChip.on{border-color:var(--sub);background:var(--subBg);font-weight:600}
.uChip:not(.on) .uNum{opacity:.55}
.soon{padding:40px 20px;text-align:center;color:var(--mute);font-size:15px;line-height:1.6}

/* ---------- spec pages ---------- */
.specWrap{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;align-items:start}
.sIdx{padding:8px;display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(12px + env(safe-area-inset-top,0px));max-height:calc(100vh - 24px);overflow:auto}
.sIdx button{display:flex;gap:10px;align-items:flex-start;text-align:left;border:0;background:transparent;padding:9px 8px;border-radius:10px;color:var(--text2)}
.sIdx button:hover{background:var(--tint)}
.sIdx button.on{background:var(--subBg)}
.sIdx .ix{display:flex;flex-direction:column;gap:2px;min-width:0}
.sIdx .ix b{font-size:13.5px;font-weight:600;color:var(--text);line-height:1.3}
.sIdx .ix small{font-size:11.5px;color:var(--mute)}
.sMain{padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.sSel{display:none}
.sHead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.sEyebrow{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--sub)}
.sTitle{font-size:22px;line-height:1.25;margin-top:2px;text-wrap:balance}
.uNum.big{min-width:44px;height:44px;border-radius:12px;font-size:16px}
.aqa{font-size:13px;font-weight:600;color:var(--sub);text-decoration:none;border:1px solid var(--subBg);background:var(--card);border-radius:18px;padding:8px 14px;white-space:nowrap}
.aqa:hover{background:var(--subBg)}
.glList{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:14px;overflow:hidden}
.glRow{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 12px;border:0;border-top:1px solid var(--row);background:var(--card);text-align:left}
.glRow:first-child{border-top:0}
.glRow:hover{background:var(--tint)}
.glT{flex:1;min-width:0;font-size:14.5px;font-weight:500;line-height:1.35}
.glT em{font-style:normal;font-size:11.5px;font-weight:600;color:var(--sub);background:var(--subBg);border-radius:8px;padding:1px 7px;margin-left:4px;white-space:nowrap}
.glC{font-size:12.5px;color:var(--mute);font-weight:600;font-variant-numeric:tabular-nums}
.papers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.paper{border:1px solid var(--border);border-top:4px solid var(--sub);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.paper b{font-size:16px}
.paper .pc{font-size:13.5px;color:var(--text2);line-height:1.4}
.paper .pm{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.paper .pm span{font-size:12px;font-weight:600;background:var(--subBg);color:var(--sub);border-radius:8px;padding:3px 8px}
.spTbl{border:1px solid var(--border);border-radius:14px;overflow:hidden}
.spHd,.sp{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.2fr);gap:14px}
.spHd{padding:10px 14px;background:var(--subBg);font-size:12.5px;font-weight:700;color:var(--sub)}
.sp{padding:12px 14px;border-top:1px solid var(--row);align-items:start}
.sp.one,.spHd.one{grid-template-columns:minmax(0,1fr)}
.spL{display:flex;gap:10px;align-items:flex-start;cursor:pointer;min-width:0}
.sp .tick{margin-top:-3px}
.spN{font-size:13px;font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:2px}
.spT{font-size:15px;font-weight:500;line-height:1.4;min-width:0}
.sp.parent{background:var(--bg)}
.sp.parent .spT{font-weight:700}
.sp.parent .spL{cursor:default}
.sp.parent.one .spN{font-size:14px}
.sp.l4 .spL{padding-left:40px}
.sp.l4 .spT{font-size:14px}
.sp.l4 .spN{font-size:12px}
.sp.done .spT{color:var(--done)}
.sp.cpRow{background:var(--subBg)}
.cpTag{font-size:11.5px;font-weight:700;background:var(--sub);color:#fff;border-radius:6px;padding:3px 7px;white-space:nowrap;margin-top:1px}
.spSum{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:13.5px;line-height:1.4;color:var(--text2)}
.spSum li::marker{color:var(--sub)}
.spSum li.rp{font-weight:600;color:var(--sub)}
.sp.done .spSum{opacity:.6}
.topicLink{margin-top:8px;border:1px solid var(--subBg);background:var(--card);color:var(--sub);border-radius:14px;min-height:30px;padding:0 10px;font-size:12.5px;font-weight:600}
.topicLink:hover{background:var(--subBg)}
.pn{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pn .secondary{min-height:44px;font-size:13.5px;max-width:100%;text-align:left}

/* ---------- timer ---------- */
.pill{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 12px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;align-items:center;gap:10px;min-height:56px;padding:0 18px 0 14px;border-radius:28px;border:0;background:var(--ink);color:var(--onInk);box-shadow:0 6px 20px rgba(51,37,42,.25);font-size:15px;font-weight:600}
.pill .ring{width:30px;height:30px;display:block}
.pill svg{width:30px;height:30px;transform:rotate(-90deg)}
.pill .t{font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.badge{font-size:12px;font-weight:600;background:rgba(255,255,255,.22);padding:2px 8px;border-radius:10px}
.tov{position:fixed;inset:0;z-index:25;display:flex;align-items:flex-end;justify-content:flex-end;background:var(--scrim);padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.tPanel{width:min(380px,100%);max-height:100%;overflow:auto;background:var(--card);border-radius:22px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:16px;box-shadow:0 10px 40px rgba(51,37,42,.25)}
.tPanel .head{align-self:stretch;display:flex;justify-content:space-between;align-items:center}
.tName{font-size:15px;font-weight:600;color:var(--text2);margin-bottom:-6px}
.big{position:relative;width:220px;height:220px;flex-shrink:0}
.big svg{width:100%;height:100%;transform:rotate(-90deg)}
.big .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.big .num b{font-size:46px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
.big .num span{font-size:13px;color:var(--mute);font-weight:500}
.quick{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.quick button{min-height:40px;min-width:60px;padding:0 12px;border-radius:20px;border:1px solid var(--btnB);background:var(--card);font-size:14px;font-weight:600;color:var(--ink)}
.quick button.on{background:var(--ink);color:var(--onInk);border-color:var(--ink)}
.ctrl{display:flex;gap:8px;align-self:stretch}
.hmsRow{display:flex;align-items:center;justify-content:center;gap:6px;align-self:stretch}
.hmsCol{display:flex;flex-direction:column;align-items:center;gap:6px}
.hmsCol span{font-size:12px;font-weight:600;color:var(--mute)}
.hmsIn{width:64px;height:54px;padding:0;border-radius:14px;border:1.5px solid var(--btnB);background:var(--inBg);text-align:center;font-size:24px;letter-spacing:.02em;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.hmsIn:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px var(--tint)}
.colon{font-size:22px;font-weight:600;color:var(--mute);padding-bottom:22px}
.tList{align-self:stretch;display:flex;flex-direction:column;gap:6px}
.tRow{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto;align-items:center;gap:10px;min-height:52px;padding:0 12px;border-radius:14px;border:1px solid var(--border);background:var(--card);text-align:left}
.tRow.on{border-color:var(--ink);background:var(--tint)}
.tRow .ring{width:28px;height:28px;display:block}.tRow svg{width:28px;height:28px;transform:rotate(-90deg)}
.tRow .tn{font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tRow .ts{font-size:12px;color:var(--mute)}
.tRow .tv{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}

/* ---------- sign in ---------- */
.login{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.loginCard{width:min(380px,100%);background:var(--card);border:1px solid var(--border);border-radius:20px;padding:26px;display:flex;flex-direction:column;gap:14px}
.loginCard p{margin:0;color:var(--text2);font-size:14.5px;line-height:1.5}
.loginCard label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--text2)}
.err{font-size:13px;color:var(--red);min-height:1em}

@media (max-width:1050px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .side{flex-direction:row;align-items:start}.side>.card{flex:1;min-width:0}
}
@media (max-width:820px){.specWrap{grid-template-columns:minmax(0,1fr)}.sIdx{display:none}.sSel{display:block}.papers{grid-template-columns:minmax(0,1fr)}}
@media (max-width:700px){
  .app{padding-block:14px 120px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));gap:14px}
  h1{font-size:22px}
  .side{flex-direction:column;align-items:stretch}
  .tt{padding:12px}
  .tl{grid-template-columns:52px minmax(0,1fr)}
  .chips{gap:4px}
  .dchip{min-height:48px;border-radius:12px}
  .panel{border-left:0;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
}
@media (max-width:600px){
  .mainTabs button{padding:0 10px}.subTabs button{flex:1;padding:0 8px}.prog .bar{width:90px}
  tr.inU td:first-child{padding-left:20px}tr.addR td{padding-left:20px!important}.uCount{display:none}
  .spHd{display:none}.sp{grid-template-columns:minmax(0,1fr);gap:8px}.spR{padding-left:40px}.sp.l4 .spL{padding-left:20px}.sp.l4 .spR{padding-left:60px}
}
@media (prefers-reduced-motion:reduce){.panel{animation:none}.tick,.tick::after,.topic,.prog .bar div{transition:none!important}.tick.pop,tr.flash td,.nudge{animation:none}}

<body>
<div class="app">
  <header class="top"><h1 id="todayLbl"></h1><button class="pillBtn" data-act="today">Today</button></header>
  <nav class="mainTabs" id="mainTabs" aria-label="Pages">
    <button data-p="tt">Timetable</button>
    <button data-p="ck">Checklists</button>
  </nav>
  <main id="page"></main>
  <div class="foot"><div class="sync" id="sync">Saved on this device</div><button class="lnk" data-act="signout" id="signoutBtn" hidden>Sign out</button></div>
</div>
<button class="pill" id="pill" aria-label="Open timers"></button>
<div class="tov" id="tov" hidden></div>
<div class="overlay" id="overlay" hidden>
  <button class="scrim" data-act="close" aria-label="Close"></button>
  <aside class="panel" role="dialog" aria-modal="true" id="panel"></aside>
</div>
<div class="login" id="login" hidden>
  <form class="loginCard" id="loginForm">
    <h1>Planner</h1>
    <p>Sign in to see your timetable, timers and checklists.</p>
    <label for="liEmail">Email<input class="in" id="liEmail" type="email" autocomplete="username" autocapitalize="off" required></label>
    <label for="liPass">Password<input class="in" id="liPass" type="password" autocomplete="current-password" required></label>
    <div class="err" id="liErr"></div>
    <button class="primary" id="liBtn">Sign in</button>
  </form>
</div>

function weekDates(s){ var m = mondayOf(s), out = []; for (var i = 0; i < 7; i++) out.push(iso(addDays(m, i))); return out; }
function fmt(min){ var h = Math.floor(min/60) % 24, m = min % 60; return (h % 12 || 12) + (m ? ':' + pad(m) : '') + (h < 12 ? 'am' : 'pm'); }
function range(s, d){ return fmt(s) + '–' + fmt(s + d); }
function dur(d){ var h = Math.floor(d/60), m = d % 60; return ((h ? h + 'h' : '') + (h && m ? ' ' : '') + (m ? m + 'm' : '')) || '0m'; }
function longDate(s){ var d = parse(s); return DAYS[dayIdx(d)] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()]; }
function act(k){ return ACT[k] || ACT.oth; }
function blocksOn(s){ return state.days[s] || []; }
function calm(){ return window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches; }
function enc(k){ return String(k).replace(/[.#$\[\]\/]/g, '_'); }
function tk(k){ return !!state.ticks[enc(k)]; }

/* ================= storage + sync ================= */
function toArr(x){ if (!x) return []; if (Array.isArray(x)) return x.filter(function(v){ return v != null; }); return Object.keys(x).sort(function(a, b){ return a - b; }).map(function(k){ return x[k]; }).filter(function(v){ return v != null; }); }
function normT(t){ var out = {}; if (!t) return out; Object.keys(t).forEach(function(k){ var rows = toArr(t[k]).map(function(r){ r = toArr(r); return [String(r[0] == null ? '' : r[0]), r[1] ? 1 : 0, r[2] ? 1 : 0, r[3] ? 1 : 0]; }); if (rows.length) out[k] = rows; }); return out; }
function normX(x){ var out = {}; if (!x || typeof x !== 'object') return out; Object.keys(x).forEach(function(k){ var v = x[k]; if (v == null) return; var a = toArr(v); if (a[0] || a[1] || a[2]) out[k] = [a[0] ? 1 : 0, a[1] ? 1 : 0, a[2] ? 1 : 0]; }); return out; }
function normal(d){
  d = d || {}; var s = blank();
  if (d.days && typeof d.days === 'object') Object.keys(d.days).forEach(function(k){
    var a = toArr(d.days[k]).map(function(b){ return {id:b.id || uid(), k:ACT[b.k] ? b.k : 'oth', t:String(b.t || ''), n:String(b.n || ''), s:+b.s || START, d:+b.d || 60, done:!!b.done}; });
    if (a.length) s.days[k] = a;
  });
  s.todos = toArr(d.todos).map(function(x){ return {id:x.id || uid(), t:String(x.t || ''), done:!!x.done}; });
  s.timers = toArr(d.timers).map(function(x){ return {id:x.id || uid(), name:String(x.name || ''), set:+x.set || 60, left:+x.left || 0, end:+x.end || 0, run:!!x.run, done:!!x.done}; });
  ['bio','chem','maths'].forEach(function(k){ s.lists[k] = toArr(d.lists && d.lists[k]).map(function(l){ var u = l.u ? toArr(l.u).map(Number).filter(function(x){ return x >= 0 && x < UNITS[k].length; }) : null; return {id:l.id || uid(), n:String(l.n || 'Exam'), u:u && u.length ? u : null, t:normT(l.t), x:normX(l.x)}; }); });
  s.ticks = (d.ticks && typeof d.ticks === 'object') ? d.ticks : {};
  return s;
}
function loadLocal(){ try { var raw = localStorage.getItem(LS_KEY); if (raw) state = normal(JSON.parse(raw)); } catch(e){} }
function saveLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){} }
function setSync(t){ var el = document.getElementById('sync'); if (el) el.textContent = t; }
function prune(){ var cut = iso(addDays(today(), -180)); Object.keys(state.days).forEach(function(k){ if (k < cut || !state.days[k].length) delete state.days[k]; }); }
function save(part){
  saveLocal();
  if (!dbRoot) return;
  clearTimeout(saveTimers[part]);
  saveTimers[part] = setTimeout(function(){
    saveTimers[part] = null;
    var v = JSON.parse(JSON.stringify(state[part]));
    dbRoot.child(part).set(v).then(function(){ setSync('Synced'); }).catch(function(){ setSync('Saved on this device – will sync when back online'); });
  }, 300);
}
function commit(part){ if (part === 'days') prune(); save(part); renderAll(); }
function connect(){
  var cfg = window.FIREBASE_CONFIG;
  if (!window.firebase || !cfg || !cfg.apiKey || /PASTE/.test(cfg.apiKey)) { setSync('Not connected to Firebase yet – saving on this device only'); return; }
  try { firebase.initializeApp(cfg); } catch(e) { setSync('Firebase settings look wrong – check firebase-config.js'); return; }
  auth = firebase.auth();
  auth.onAuthStateChanged(function(u){
    if (dbRoot) { dbRoot.off(); dbRoot = null; }
    if (!u) { document.getElementById('login').hidden = false; document.getElementById('signoutBtn').hidden = true; setSync('Signed out'); return; }
    document.getElementById('login').hidden = true; document.getElementById('signoutBtn').hidden = false;
    setSync('Connecting…');
    dbRoot = firebase.database().ref('users/' + u.uid + '/holiday');
    var first = true;
    dbRoot.on('value', function(snap){
      var raw = snap.val();
      if (first && raw == null) { first = false; PARTS.forEach(save); setSync('Synced'); return; }
      first = false;
      var remote = normal(raw), changed = false;
      PARTS.forEach(function(p){ if (saveTimers[p]) return; if (JSON.stringify(remote[p]) !== JSON.stringify(state[p])) { state[p] = remote[p]; changed = true; } });
      setSync('Synced');
      if (changed) { saveLocal(); renderAll(); }
    }, function(){ setSync('Couldn’t reach the database – check the rules in Firebase'); });
  });
}

/* ================= timetable ================= */
function layout(list){
  var a = list.slice().sort(function(x, y){ return x.s - y.s || y.d - x.d; });
  var out = [], cluster = [], cols = [], cEnd = -1;
  function flush(){ var n = cols.length; cluster.forEach(function(c){ c.n = n; }); cluster = []; cols = []; }
  a.forEach(function(b){
    if (b.s + b.d <= START || b.s >= END) return;
    if (cluster.length && b.s >= cEnd) { flush(); cEnd = -1; }
    var col = -1;
    for (var i = 0; i < cols.length; i++) if (cols[i] <= b.s) { col = i; break; }
    if (col < 0) { col = cols.length; cols.push(0); }
    cols[col] = b.s + b.d;
    var item = {b:b, c:col}; cluster.push(item); out.push(item);
    cEnd = Math.max(cEnd, b.s + b.d);
  });
  flush(); return out;
}
function hoursCol(ppm){
  var h = [];
  for (var m = START; m < END; m += 60) h.push('<div style="top:' + ((m - START) * ppm) + 'px">' + fmt(m) + '</div>');
  return '<div class="hours" style="height:' + ((END - START) * ppm) + 'px">' + h.join('') + '</div>';
}
function laneHtml(date, ppm, compact){

  layout(blocksOn(date)).forEach(function(it){
    var b = it.b, a = act(b.k), s = Math.max(b.s, START), e = Math.min(b.s + b.d, END);
    var top = (s - START) * ppm, ht = Math.max((e - s) * ppm - 2, 14), w = 100 / it.n, left = it.c * w;
    var tight = ht < (compact ? 34 : 40), showNote = !compact && b.n && ht >= 62;
    h.push('<button class="blk' + (tight ? ' tight' : '') + (b.done ? ' done' : '') + '" data-act="edit" data-date="' + date + '" data-id="' + b.id + '" style="top:' + (top + 1) + 'px;height:' + ht + 'px;left:calc(' + left + '% + 2px);width:calc(' + w + '% - 4px);background:' + a.bg + ';color:' + a.fg + '" aria-label="' + esc(b.t) + ', ' + range(b.s, b.d) + '"><b>' + esc(b.t) + '</b><span>' + (tight && compact ? fmt(b.s) : range(b.s, b.d) + (compact ? '' : ' · ' + dur(b.d))) + '</span>' + (showNote ? '<i>' + esc(b.n) + '</i>' : '') + '</button>');
  });
  if (date === iso(today())) { var n = new Date(), nm = n.getHours() * 60 + n.getMinutes(); if (nm >= START && nm < END) h.push('<div class="nowLine" style="top:' + ((nm - START) * ppm) + 'px"></div>'); }
  return '<div class="lane" style="height:' + H + 'px">' + h.join('') + '</div>';
}
function weekLabel(){ var w = weekDates(ui.date), a = parse(w[0]), b = parse(w[6]); return a.getDate() + (a.getMonth() !== b.getMonth() ? ' ' + MSHORT[a.getMonth()] : '') + ' – ' + b.getDate() + ' ' + MSHORT[b.getMonth()]; }

function nextFree(date){

  for (; m < END - 15; m += 30) { var mm = m; if (!list.some(function(b){ return b.s < mm + 30 && mm < b.s + b.d; })) return m; }
  return 9 * 60;
}

  if (t.id === 'cspecSel') { ui.cSec = isNaN(+t.value) ? t.value : +t.value; renderAll(); return; }
  if (t.dataset.sp) {
    var key = enc(t.dataset.sp);
    if (t.checked) state.ticks[key] = 1; else delete state.ticks[key];
    save('ticks');
    if (t.checked) pop(t);
    t.closest('.sp').classList.toggle('done', t.checked);
    var isC = ui.subj === 'chem', sc = isC ? cCount(ui.cSec) : secCount(ui.specSec), pc = sc.n ? Math.round(sc.d / sc.n * 100) : 0;
    var scEl = document.getElementById(isC ? 'csc-' + ui.cSec : 'sc-' + ui.specSec); if (scEl) scEl.textContent = sc.d + ' of ' + sc.n;
    var bar = document.querySelector('#spBar div'); if (bar) bar.style.width = pc + '%';
    var tx = document.getElementById('spTxt'); if (tx) tx.textContent = sc.d + ' of ' + sc.n + ' ticked';
    if (pc === 100 && t.checked) confetti(document.getElementById('spBar'));
    return;
  }
  var isFlat = t.dataset.fu !== undefined;
  if (isFlat || (t.dataset.r !== undefined && t.dataset.u !== undefined)) {
    var l = curList(); if (!l) return;
    var all;
    if (isFlat) {
      l.x = l.x || {};
      var xi = l.x[t.dataset.fu] = (l.x[t.dataset.fu] || [0, 0, 0]).slice();
      xi[+t.dataset.c] = t.checked ? 1 : 0;
      if (!(xi[0] || xi[1] || xi[2])) delete l.x[t.dataset.fu];
      all = !!(xi[0] && xi[1] && xi[2]);
    } else {
      var row = l.t[t.dataset.u][+t.dataset.r]; row[+t.dataset.c] = t.checked ? 1 : 0;
      all = !!(row[1] && row[2] && row[3]);
    }
    save('lists');
    if (t.checked) pop(t);
    var tr = t.closest('tr'), was = tr.classList.contains('all');
    tr.classList.toggle('all', all);
    if (all && !was && !calm()) { tr.classList.remove('flash'); void tr.offsetWidth; tr.classList.add('flash'); }
    if (!isFlat) { var uc = document.getElementById('uc-' + t.dataset.u); if (uc) uc.textContent = uCount(l.t[t.dataset.u]); }
    var pct = listProgress(l), bar2 = document.querySelector('#pBar div'), txt = document.getElementById('pTxt');
    var before = parseInt(bar2.style.width, 10) || 0;
    bar2.style.width = pct + '%'; txt.textContent = pct + '% complete';
    if (!calm()) { txt.classList.remove('nudge'); void txt.offsetWidth; txt.classList.add('nudge'); }
    if (pct === 100 && before < 100) confetti(document.getElementById('pBar'));
  }
});
document.addEventListener('submit', function(e){
  e.preventDefault();
  var f = e.target;
  if (f.id === 'loginForm') {
    var em = document.getElementById('liEmail').value.trim(), pw = document.getElementById('liPass').value, er = document.getElementById('liErr'), bt = document.getElementById('liBtn');
    if (!auth) { er.textContent = 'Firebase isn’t set up yet. Check firebase-config.js.'; return; }
    er.textContent = ''; bt.disabled = true; bt.textContent = 'Signing in…';
    auth.signInWithEmailAndPassword(em, pw).catch(function(err){
      var c = err && err.code || '';
      er.textContent = /invalid|wrong-password|user-not-found/.test(c) ? 'That email or password isn’t right. Check them and try again.' : /too-many/.test(c) ? 'Too many tries. Wait a few minutes, then try again.' : /network/.test(c) ? 'No internet connection. Connect and try again.' : 'Couldn’t sign in (' + c + ').';
    }).then(function(){ bt.disabled = false; bt.textContent = 'Sign in'; });
    return;
  }
  if (f.id === 'todoForm') { var inp = document.getElementById('todoIn'), v = inp.value.trim(); if (!v) return; inp.value = ''; state.todos.push({id:uid(), t:v, done:false}); commit('todos'); var ti = document.getElementById('todoIn'); if (ti) ti.focus(); return; }
  if (f.id === 'nameForm') {
    var nm = document.getElementById('nameIn').value.trim();
    if (!nm) { ui.nameErr = 'Give this exam a name.'; renderAll(); return; }
    if (!ui.pickUnits.length) { ui.nameErr = 'Pick at least one unit for this exam.'; ui.nameDraft = nm; renderAll(); return; }
    var picked = ui.pickUnits.slice();
    if (ui.naming === 'new') { var nl = {id:uid(), n:nm, u:picked, t:{}}; state.lists[ui.subj].push(nl); ui.list[ui.subj] = nl.id; }
    else { var cl = curList(); if (cl) { cl.n = nm; cl.u = picked; } }
    ui.naming = null; ui.nameErr = ''; commit('lists'); return;
  }
  if (f.classList.contains('uAdd')) {
    var u = f.dataset.u, val = f.querySelector('input').value.trim(), lst = curList(); if (!val || !lst) return;
    (lst.t[u] = lst.t[u] || []).push([val, 0, 0, 0]);
    commit('lists');
    var na = document.getElementById('ua-' + u); if (na) na.focus();
  }
});

connect();
